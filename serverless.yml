service: mom-agent-service
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_OPTIONS: --enable-source-maps
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - http://127.0.0.1:5173
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - OPTIONS
        - GET
        - POST
      allowCredentials: false

functions:
  graphql:
    handler: src/handler.graphqlHandler
    events:
      - httpApi:
          path: /graphql
          method: '*'

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: es2021
    platform: node
    define:
      'require.resolve': undefined
    tsconfig: tsconfig.json
  serverless-offline:
    httpPort: 3000
